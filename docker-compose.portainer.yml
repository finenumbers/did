# Portainer stack for NPM (Nginx Proxy Manager).
#
# Prerequisites on the Docker host:
#   1. External network already exists:  docker network create proxy
#      (or use the network NPM is attached to — usually named "proxy")
#   2. Pull amd64 images (Apple Silicon hosts: --platform linux/amd64)
#
# Portainer → Stacks → Add stack → Web editor: paste this file
# Environment variables: paste from deploy/portainer.env.example
#
# NPM Proxy Host examples (Forward Hostname / IP = Docker DNS name):
#   UI:  http://did-frontend:3000
#   API (optional separate host): http://did-backend:8000
#
# No host ports are published — traffic enters only via NPM on network "proxy".

services:
  db:
    image: postgres:16-alpine
    container_name: did-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-did}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-did}
    volumes:
      - did_pgdata:/var/lib/postgresql/data
    networks:
      - did_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-did} -d ${POSTGRES_DB:-did}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/finenumbers/did-backend:${DID_IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    container_name: did-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-did}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-did}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?set BACKEND_CORS_ORIGINS to your public UI origin, e.g. https://did.example.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      SYNC_DROPPED_XLSX_PATH: /data/sync/sync_dropped_latest.xlsx
      SYNC_DEBUG_LOG_PATH: /data/sync/sync_latest.log
      NUMBERS_EXPORT_DIR: /data/exports
    volumes:
      - did_sync_data:/data/sync
      - did_exports_data:/data/exports
    networks:
      - did_internal
      - proxy
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/finenumbers/did-frontend:${DID_IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    container_name: did-frontend
    restart: unless-stopped
    environment:
      # Same-origin API via Next server proxy (browser → NPM → frontend → backend)
      # Do not set ADMIN_API_TOKEN here — proxy must not inject a machine token.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    networks:
      - did_internal
      - proxy
    depends_on:
      - backend

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:-proxy}
  did_internal:
    driver: bridge
    name: did_internal

volumes:
  did_pgdata:
    name: did_pgdata
  did_sync_data:
    name: did_sync_data
  did_exports_data:
    name: did_exports_data
