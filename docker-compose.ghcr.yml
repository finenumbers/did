# Production-style compose using GHCR images (linux/amd64).
# Example:
#   docker compose -f docker-compose.ghcr.yml --env-file .env up -d
# Requires ADMIN_PASSWORD and ADMIN_SESSION_SECRET in the env file (no weak defaults).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-did}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-did}
    volumes:
      - did_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-did} -d ${POSTGRES_DB:-did}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/finenumbers/did-backend:${DID_IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://did:did@db:5432/did}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      DID_REQUIRE_AUTH: ${DID_REQUIRE_AUTH:-1}
      SYNC_DROPPED_XLSX_PATH: /data/sync/sync_dropped_latest.xlsx
      SYNC_DEBUG_LOG_PATH: /data/sync/sync_latest.log
      NUMBERS_EXPORT_DIR: /data/exports
    volumes:
      - did_sync_data:/data/sync
      - did_exports_data:/data/exports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    image: ghcr.io/finenumbers/did-frontend:${DID_IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    environment:
      # Do not set ADMIN_API_TOKEN here — proxy must not inject a machine token.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  did_pgdata:
  did_sync_data:
  did_exports_data:
